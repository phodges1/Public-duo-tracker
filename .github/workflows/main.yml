name: iPhone Duo stock check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore last results
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-

      - name: Check Apple Store stock
        env:
          ZIP_CODE: ${{ secrets.ZIP_CODE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAX_MILES: "40"
          TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' }}
        run: python check_stock.py

      - name: Save results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
